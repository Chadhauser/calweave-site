name: IndexNow ping
on:
  push:
    branches: [main]
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Submit URLs to IndexNow
        run: |
          python3 - << 'EOF'
          import json, re, urllib.request
          HOST = "calweave.app"
          KEY = "30cff8b4b698437cdff14e471ed17fd7"
          try:
              urls = re.findall(r"<loc>(.*?)</loc>", open("sitemap.xml").read())
          except Exception:
              urls = [f"https://{HOST}/", f"https://{HOST}/guides/export-google-calendar-to-sheets.html", f"https://{HOST}/guides/sync-google-sheets-to-calendar.html"]
          body = json.dumps({"host": HOST, "key": KEY,
                             "keyLocation": f"https://{HOST}/{KEY}.txt",
                             "urlList": urls[:100]}).encode()
          req = urllib.request.Request("https://api.indexnow.org/indexnow", data=body,
                headers={"Content-Type": "application/json; charset=utf-8"})
          try:
              print("IndexNow:", urllib.request.urlopen(req, timeout=30).status, len(urls), "urls")
          except Exception as e:
              print("IndexNow ping failed (non-fatal):", e)
          EOF
